<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線上展間 3D Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1a16; --dim:#6f685c; --bg:#e9e4d8; --panel:rgba(251,249,243,.92);
  --line:rgba(29,26,22,.18); --gold:#8f6d2a; --paper:#fbf9f3; --paperink:#1b1916;
  --serif:"Cormorant Garamond","Noto Serif TC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
html.free,html.free body{overflow:hidden;height:100%}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;outline:none}
html.free #gl{touch-action:none;cursor:grab}
html.free #gl.drag{cursor:grabbing}
#track{width:1px;pointer-events:none}
html.free #track{display:none}

/* top bar */
#bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:linear-gradient(rgba(240,236,227,.92),rgba(240,236,227,0));z-index:5;pointer-events:none}
#bar>*{pointer-events:auto}
.brand{font-family:var(--serif);font-size:22px;letter-spacing:.06em;margin-right:auto;white-space:nowrap}
.brand small{font-family:var(--sans);font-size:11px;letter-spacing:.18em;color:var(--dim);margin-left:8px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.seg button{border:0;background:none;color:var(--dim);font:500 13px var(--sans);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--sans);padding:9px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);white-space:nowrap}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn:focus-visible,.seg button:focus-visible,.hot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* tour caption */
#cap{position:fixed;left:18px;bottom:18px;width:min(400px,calc(100vw - 36px));z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px 14px;backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(40,32,20,.14);
  transition:opacity .35s, transform .35s;opacity:0;transform:translateY(10px);pointer-events:none}
#cap.on{opacity:1;transform:none;pointer-events:auto}
html.free #cap{display:none}
#cap .no{font:500 11px var(--sans);letter-spacing:.2em;color:var(--gold)}
#cap h2{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.15;margin:6px 0 4px;overflow-wrap:anywhere}
#cap .by{font-size:13px;color:var(--dim);margin-bottom:8px}
#cap p{font-size:14px;line-height:1.65;margin:0 0 12px;color:#3b362e;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#cap .row{display:flex;gap:8px;flex-wrap:wrap}
#nav{position:fixed;right:14px;bottom:18px;z-index:4;display:flex;flex-direction:column;gap:8px}
html.free #nav{display:none}
#nav button{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px}
#bar-prog{position:fixed;left:0;top:0;height:2px;background:var(--gold);width:0;z-index:6}
html.free #bar-prog{display:none}

/* free mode */
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:9px 16px;font-size:12.5px;color:var(--dim);transition:opacity .6s;pointer-events:none;display:none;max-width:calc(100vw - 24px);text-align:center;line-height:1.5;border-radius:18px}
html.free #hint{display:block}
#joy{position:fixed;left:22px;bottom:26px;width:112px;height:112px;border-radius:50%;border:1px solid var(--line);background:rgba(251,249,243,.55);
  z-index:5;display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(29,26,22,.72)}
html.free.touch #joy{display:block}
html.free.touch #hint{bottom:auto;top:62px}
.hot{position:fixed;left:0;top:0;width:30px;height:30px;margin:-15px;border-radius:50%;border:1.5px solid var(--ink);background:rgba(251,249,243,.9);
  color:var(--ink);font:600 12px var(--sans);z-index:3;cursor:pointer;display:none;padding:0}
.hot::after{content:"";position:absolute;inset:-9px;border-radius:50%}

/* sheet */
#veil{position:fixed;inset:0;background:rgba(30,25,18,.38);z-index:8;opacity:0;pointer-events:none;transition:opacity .25s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:9;right:0;top:0;bottom:0;width:min(420px,100vw);background:var(--paper);color:var(--paperink);
  transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:26px 24px 28px;box-shadow:-10px 0 40px rgba(40,32,20,.18);-webkit-overflow-scrolling:touch}
#sheet.on{transform:none}
@media (max-width:640px){
  #sheet{top:auto;left:0;width:100%;max-height:86vh;border-radius:14px 14px 0 0;transform:translateY(102%);padding:22px 20px 26px}
  .brand small{display:none}
  .brand{font-size:19px}
  #cap{left:12px;bottom:12px;width:calc(100vw - 80px);padding:13px 14px 12px}
  #cap h2{font-size:22px}
  #cap p{-webkit-line-clamp:3;font-size:13.5px}
  #nav{right:10px;bottom:12px}
  .seg button{padding:7px 10px}
  #upTop span{display:none}
}
#sheet .no{font:600 11px var(--sans);letter-spacing:.2em;color:#8a6a2a}
#sheet h3{font-family:var(--serif);font-size:32px;line-height:1.12;margin:8px 0 6px;font-weight:600;overflow-wrap:anywhere}
#sheet .by{font-size:14px;color:#5d574c;margin-bottom:4px}
#sheet .med{font-size:13px;color:#847d70;margin-bottom:14px}
#sheet .desc{font-size:15px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 20px}
#sheet img.pv{width:100%;max-height:230px;object-fit:contain;background:#e6e1d6;border-radius:4px;margin-bottom:16px;display:block}
#sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
#sheet .b{border:1px solid #1b1916;background:#1b1916;color:var(--paper);font:500 14px var(--sans);padding:10px 16px;border-radius:999px;cursor:pointer}
#sheet .b.o{background:none;color:#1b1916}
#sheet .b.t{background:none;border-color:transparent;color:#8b3a2a;padding-left:4px}
#sheet .x{position:absolute;right:14px;top:12px;width:38px;height:38px;border:0;background:none;font-size:24px;color:#5d574c;cursor:pointer}
#sheet label{display:block;font:600 12px var(--sans);letter-spacing:.06em;color:#5d574c;margin:14px 0 6px}
#sheet input[type=text],#sheet textarea,#sheet select{width:100%;font:15px var(--sans);padding:10px 12px;border:1px solid #c9c2b3;border-radius:6px;background:#fff;color:#1b1916}
#sheet textarea{min-height:96px;resize:vertical;line-height:1.6}
#sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#sheet .drop{border:1.5px dashed #a59d8c;border-radius:8px;padding:16px;text-align:center;font-size:14px;color:#5d574c;cursor:pointer;background:#ebe7dd}
#sheet .drop.has{border-style:solid;border-color:#8a6a2a;color:#1b1916}
#sheet .note{font-size:12px;color:#847d70;line-height:1.6;margin-top:16px}
#sheet .err{color:#8b3a2a;font-size:13px;margin-top:8px;min-height:1em}
#editor{position:fixed;inset:0;z-index:30;background:#1b1916;color:#f3efe6;display:none;flex-direction:column}
#editor.on{display:flex}
#editor .top{padding:14px 16px 6px}
#editor .top b{font-family:var(--serif);font-size:22px;font-weight:600}
#editor .top p{margin:4px 0 0;font-size:13px;line-height:1.5;color:#b8b1a3}
#editor .stage{flex:1;min-height:160px;position:relative;overflow:hidden;touch-action:none}
#editor canvas{position:absolute;display:block}
#editor .ov{left:0;top:0;width:100%;height:100%;cursor:crosshair}
#editor .ctl{padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px;background:#141210;border-top:1px solid rgba(243,239,230,.14)}
#editor .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#editor .eb{border:1px solid rgba(243,239,230,.3);background:none;color:#f3efe6;font:500 13.5px var(--sans);padding:9px 14px;border-radius:999px;cursor:pointer}
#editor .eb.on{background:#f3efe6;color:#1b1916}
#editor .eb.go{background:#c9a45c;border-color:#c9a45c;color:#1a1509}
#editor .eb:focus-visible{outline:2px solid #c9a45c;outline-offset:2px}
#editor label{font-size:13px;color:#b8b1a3;display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
#editor input[type=range]{flex:1;accent-color:#c9a45c}
#editor .tip{font-size:12px;color:#8f887b;line-height:1.5;margin:0}
#fade{position:fixed;inset:0;background:var(--bg);z-index:20;transition:opacity 1s;pointer-events:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;letter-spacing:.2em;color:var(--dim)}
@media (prefers-reduced-motion:reduce){#cap,#sheet,#veil,#fade{transition:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="3D 展間"></canvas>
<div id="track"></div>
<div id="bar-prog"></div>

<header id="bar">
  <div class="brand">線上展間<small>ART GALLERY</small></div>
  <div class="seg" role="group" aria-label="瀏覽模式">
    <button id="mTour" aria-pressed="true">導覽</button>
    <button id="mFree" aria-pressed="false">自由走動</button>
  </div>
  <button class="btn gold" id="upTop" aria-label="上傳作品">＋<span> 上傳作品</span></button>
</header>

<section id="cap" aria-live="polite"></section>
<div id="nav">
  <button class="btn" id="prev" aria-label="上一件">↑</button>
  <button class="btn" id="next" aria-label="下一件">↓</button>
</div>

<div id="hint"></div>
<div id="joy" aria-hidden="true"><i></i></div>
<div id="hots"></div>

<div id="veil"></div>
<aside id="sheet" role="dialog" aria-modal="true" aria-label="作品資訊"></aside>
<div id="editor" role="dialog" aria-modal="true" aria-label="校正圖片"></div>
<div id="fade">載入展間…</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var fade=$('#fade');
if(!window.THREE){fade.textContent='3D 函式庫載入失敗，請重新整理';return;}

/* ---------- constants ---------- */
var W=8,H=6.4,RISE=2.3,ZF=20,ZB=-22,EYE=1.65;
var AR=1.9,ASP=3.7,AW=6.2,AD=8.5,AH=7.4;
var DOORZ=-12,DOORHW=1.2,DOORSP=2.7,WINZ=[8,-4]; // opening to the outside and the tall windows, all on the left (sunny) wall
// // arch half-width, arch springing height, apse width/depth/height
var SLOTS=[
  {wall:'L',z:16},{wall:'L',z:12},{wall:'R',z:12},{wall:'R',z:8},{wall:'L',z:4},{wall:'L',z:0},
  {wall:'R',z:0},{wall:'R',z:-4},{wall:'L',z:-8},{wall:'R',z:-12},{wall:'R',z:-16},{wall:'E',z:ZB-AD}
];
var N=SLOTS.length;
var DEF_DESC=(window.GALLERY_CONFIG&&window.GALLERY_CONFIG.supabaseUrl)?'這個畫框還在等一件作品，目前掛的是示範畫面。':'這是預設的示範畫面。點「更換作品」上傳你自己的圖片，並填上標題、作者與介紹，它就會掛在這個畫框裡。';

/* ---------- renderer / scene ---------- */
var canvas=$('#gl');
var renderer;
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){fade.textContent='這個瀏覽器無法啟用 WebGL';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0xe9e4d8);
scene.fog=new THREE.Fog(0xf1eee8,40,110);
var camera=new THREE.PerspectiveCamera(60,1,0.1,120);
camera.position.set(0,EYE,18.5);
var maxAniso=renderer.capabilities.getMaxAnisotropy();

function tex(src){var t=new THREE.Texture(src);t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;t.needsUpdate=true;return t;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- room: tall nave lit from the left, with pilasters, an opening to the outside and an apse ---------- */
(function buildRoom(){
  var len=ZF-ZB, cz=(ZF+ZB)/2, DADO=1.0, WY0=1.25, WH=4.5, WHW=1.15;
  var wallM=new THREE.MeshLambertMaterial({color:0xe9e6df,side:THREE.DoubleSide});
  var trim=new THREE.MeshLambertMaterial({color:0xfaf8f3}), gold=new THREE.MeshLambertMaterial({color:0xa9843f});
  var dark=new THREE.MeshLambertMaterial({color:0x3a2a1c}), lamp=new THREE.MeshBasicMaterial({color:0xfffdf5});
  var shade=new THREE.MeshLambertMaterial({color:0xc9c6c0});
  function box(m,w,h,d,x,y,z){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o;}
  function plane(m,w,h,x,y,z,ry,rx){var o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);o.position.set(x,y,z);if(ry)o.rotation.y=ry;if(rx)o.rotation.x=rx;scene.add(o);return o;}
  function canvas(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}

  // --- weathered plank floor: uneven widths, grey-brown, worn pale down the middle of each board ---
  var c=canvas(1024,1024),g=c.getContext('2d'),r=mulberry(11),i,k,x,y;
  g.fillStyle='#2a211a';g.fillRect(0,0,1024,1024);
  x=0;
  while(x<1024){
    var pw=Math.min(58+Math.floor(r()*56),1024-x);if(1024-x-pw<40)pw=1024-x;
    var hue=24+r()*10,sat=10+r()*14,lig=27+r()*13,joint=Math.floor(r()*1024),two=r()>0.45;
    for(var part=0;part<(two?2:1);part++){
      var y0=part?joint:0,y1=two?(part?1024:joint):1024,l2=lig+(part?(r()-0.5)*8:0);
      g.fillStyle='hsl('+hue+','+sat+'%,'+l2+'%)';g.fillRect(x+2,y0+(part?2:0),pw-3,y1-y0-(two?2:0));
      var wg=g.createLinearGradient(x,0,x+pw,0);wg.addColorStop(0,'rgba(0,0,0,.28)');wg.addColorStop(.18,'rgba(225,205,175,.05)');
      wg.addColorStop(.5,'rgba(232,214,186,'+(0.08+r()*0.14)+')');wg.addColorStop(.85,'rgba(225,205,175,.04)');wg.addColorStop(1,'rgba(0,0,0,.3)');
      g.fillStyle=wg;g.fillRect(x+2,y0,pw-3,y1-y0);
    }
    for(k=0;k<pw*1.6;k++){var gx=x+2+r()*(pw-4),gy=r()*1024,gl=40+r()*240;
      g.fillStyle='rgba('+(r()>.5?'238,222,196':'18,11,6')+','+(0.03+r()*0.09)+')';g.fillRect(gx,gy,1+(r()>.9?1:0),gl);}
    for(k=0;k<3;k++){var ny=r()*1024;g.fillStyle='rgba(12,8,5,.55)';g.fillRect(x+7,ny,3,3);g.fillRect(x+pw-10,ny,3,3);}
    g.fillStyle='rgba(8,5,3,.9)';g.fillRect(x,0,2,1024);
    x+=pw;
  }
  for(k=0;k<70;k++){var bx=r()*1024,by=r()*1024,rx=40+r()*150,ry=20+r()*70,bg=g.createRadialGradient(bx,by,0,bx,by,rx);
    var pale=r()>.4;bg.addColorStop(0,pale?'rgba(226,208,180,.13)':'rgba(20,13,8,.2)');bg.addColorStop(1,'rgba(0,0,0,0)');
    g.save();g.translate(bx,by);g.scale(ry/rx,1);g.translate(-bx,-by);g.fillStyle=bg;g.fillRect(bx-rx,by-rx,rx*2,rx*2);g.restore();}
  function floorMat(w,l){var t=tex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(w/3.6,l/3.6);return new THREE.MeshPhongMaterial({map:t,shininess:18,specular:0x2a241c});}
  // --- dark panelled wainscot ---
  var cw=canvas(512,256),gw=cw.getContext('2d');r=mulberry(21);
  for(i=0;i<16;i++){gw.fillStyle='hsl('+(22+r()*8)+','+(18+r()*10)+'%,'+(14+r()*8)+'%)';gw.fillRect(i*32,0,32,256);gw.fillStyle='rgba(0,0,0,.5)';gw.fillRect(i*32,0,2,256);}
  for(k=0;k<2400;k++){gw.fillStyle='rgba('+(r()>.5?'215,188,150':'0,0,0')+','+(r()*0.09)+')';gw.fillRect(r()*512,r()*256,1,10+r()*70);}
  [[26,34,460,188]].forEach(function(q){ // one recessed panel per repeat
    gw.fillStyle='rgba(0,0,0,.2)';gw.fillRect(q[0],q[1],q[2],q[3]);
    gw.fillStyle='rgba(0,0,0,.6)';gw.fillRect(q[0],q[1],q[2],7);gw.fillRect(q[0],q[1],7,q[3]);
    gw.fillStyle='rgba(225,200,160,.22)';gw.fillRect(q[0],q[1]+q[3]-6,q[2],6);gw.fillRect(q[0]+q[2]-6,q[1],6,q[3]);});
  gw.fillStyle='rgba(0,0,0,.45)';gw.fillRect(0,0,512,10);gw.fillStyle='rgba(225,200,160,.14)';gw.fillRect(0,10,512,3);
  function dadoMat(l){var t=tex(cw);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(Math.max(1,Math.round(l/2)),1);return new THREE.MeshLambertMaterial({map:t});}
  // --- arched window + the pool of sun it throws ---
  var R=176,cx=192,sp=200;
  function archPath(gn){gn.beginPath();gn.moveTo(cx-R,768);gn.lineTo(cx-R,sp);gn.arc(cx,sp,R,Math.PI,0,false);gn.lineTo(cx+R,768);gn.closePath();}
  function bars(gn,scale){gn.lineCap='butt';
    gn.lineWidth=16*scale;gn.beginPath();gn.moveTo(cx,sp+4);gn.lineTo(cx,768);gn.moveTo(0,sp+8);gn.lineTo(384,sp+8);gn.stroke();
    gn.lineWidth=8*scale;gn.beginPath();[cx-R/2-6,cx+R/2+6].forEach(function(vx){gn.moveTo(vx,sp);gn.lineTo(vx,768);});
    for(var yy=sp+140;yy<760;yy+=140){gn.moveTo(0,yy);gn.lineTo(384,yy);}
    gn.moveTo(cx+96,sp);gn.arc(cx,sp,96,0,Math.PI,true);
    for(var q=1;q<6;q++){var an=Math.PI*q/6;gn.moveTo(cx-Math.cos(an)*96,sp-Math.sin(an)*96);gn.lineTo(cx-Math.cos(an)*R,sp-Math.sin(an)*R);}
    gn.stroke();}
  var cwin=canvas(384,768),gn=cwin.getContext('2d');
  archPath(gn);var gg=gn.createLinearGradient(0,0,0,768);gg.addColorStop(0,'#ffffff');gg.addColorStop(1,'#f6f8f9');gn.fillStyle=gg;gn.fill();
  gn.save();archPath(gn);gn.clip();gn.strokeStyle='#cfd0cc';bars(gn,1);gn.restore();
  gn.lineWidth=14;gn.strokeStyle='#f1eee7';archPath(gn);gn.stroke();
  var winM=new THREE.MeshBasicMaterial({map:tex(cwin),transparent:true,alphaTest:0.5});
  function sunTex(withBars){var cv=canvas(384,768),q=cv.getContext('2d'),tmp=canvas(384,768),t=tmp.getContext('2d');
    archPath(t);t.fillStyle='rgb(255,236,205)';t.fill();
    if(withBars){t.globalCompositeOperation='destination-out';t.strokeStyle='#000';t.save();archPath(t);t.clip();bars(t,1.5);t.restore();}
    if('filter' in q)q.filter='blur(7px)';q.drawImage(tmp,12,12,360,744);return tex(cv);}
  var KX=0.62,KZ=-0.34; // metres the light travels across (x) and along (z) the floor per metre it falls
  function sunPatch(zc,hw,y0,y1,t,op){
    function P(z,yy){return [-W/2+yy*KX,0.008,z+yy*KZ];}
    var a=P(zc+hw,y0),b=P(zc-hw,y0),cc=P(zc-hw,y1),d=P(zc+hw,y1),geo=new THREE.BufferGeometry();

  var portrait=camera.aspect<0.9, vt=Math.tan(camera.fov*Math.PI/360), ht=vt*camera.aspect;

  });

    if(i===stops.length-2){trans.push({pos:new THREE.Vector3(1.4,EYE,mz),q:qLook(1.4,EYE,mz,8,EYE,mz)});}

      var g=ov.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,SW,SH);
      g.beginPath();g.rect(0,0,SW,SH);g.moveTo(X(st.pts[0]),Y(st.pts[0]));for(var i=1;i<4;i++)g.lineTo(X(st.pts[i]),Y(st.pts[i]));g.closePath();
      g.fillStyle='rgba(10,8,6,.6)';g.fill('evenodd');
      g.beginPath();g.moveTo(X(st.pts[0]),Y(st.pts[0]));for(i=1;i<4;i++)g.lineTo(X(st.pts[i]),Y(st.pts[i]));g.closePath();
      g.strokeStyle='#c9a45c';g.lineWidth=2;g.stroke();
      if(!st.pick)st.pts.forEach(function(p){g.beginPath();g.arc(X(p),Y(p),11,0,7);g.fillStyle='rgba(27,25,22,.55)';g.fill();g.strokeStyle='#fff';g.lineWidth=2.5;g.stroke();});
    }
    function layout(){
      var r=stage.getBoundingClientRect();SW=r.width;SH=r.height;var pad=26,sc=Math.min((SW-pad*2)/sw,(SH-pad*2)/sh);
      dw=Math.max(2,Math.round(sw*sc));dh=Math.max(2,Math.round(sh*sc));ox=Math.round((SW-dw)/2);oy=Math.round((SH-dh)/2);
      cv.width=dw;cv.height=dh;cv.style.left=ox+'px';cv.style.top=oy+'px';cv.style.width=dw+'px';cv.style.height=dh+'px';
      ov.width=Math.round(SW*dpr);ov.height=Math.round(SH*dpr);
      var g=cv.getContext('2d');g.drawImage(src,0,0,dw,dh);base=g.getImageData(0,0,dw,dh);paint();drawOv();
    }
    var drag=-1;
    function pos(e){var r=stage.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
    ov.onpointerdown=function(e){
      var q=pos(e),u=(q[0]-ox)/dw,v=(q[1]-oy)/dh;
      if(st.pick){
        if(u<0||u>1||v<0||v>1)return;
        var cx=Math.round(u*(sw-1)),cy=Math.round(v*(sh-1)),n=0,a=[0,0,0],rad=Math.max(2,Math.round(sw/250));
        for(var y=Math.max(0,cy-rad);y<=Math.min(sh-1,cy+rad);y++)for(var x=Math.max(0,cx-rad);x<=Math.min(sw-1,cx+rad);x++){var o=(y*sw+x)*4;a[0]+=S[o];a[1]+=S[o+1];a[2]+=S[o+2];n++;}
        var gr=(a[0]+a[1]+a[2])/3;
        if(gr/n<24){msg.textContent='這裡太暗了，請改點比較亮的白色或灰色區域。';return;}
        st.gain=a.map(function(c){return Math.min(2,Math.max(0.5,gr/Math.max(c,1)));});
        st.pick=false;wbBtn.classList.remove('on');wbBtn.textContent='白平衡已校正，可再點一次重選';msg.textContent=MSG;paint();drawOv();return;
      }
      var best=-1,bd=34*34;st.pts.forEach(function(p,i){var d=(X(p)-q[0])*(X(p)-q[0])+(Y(p)-q[1])*(Y(p)-q[1]);if(d<bd){bd=d;best=i;}});
      drag=best;if(drag>=0){try{ov.setPointerCapture(e.pointerId);}catch(_){ }e.preventDefault();}
    };
    ov.onpointermove=function(e){if(drag<0)return;var q=pos(e);st.pts[drag]=[Math.min(1,Math.max(0,(q[0]-ox)/dw)),Math.min(1,Math.max(0,(q[1]-oy)/dh))];drawOv();};
    ov.onpointerup=ov.onpointercancel=function(){drag=-1;};
    $('#edHl').oninput=function(){st.hl=this.value/100;paint();};
    function close(v){el.classList.remove('on');el.innerHTML='';window.removeEventListener('resize',layout);ed=null;resolve(v);}
    function finish(){
      var P=st.pts.map(function(p){return [p[0]*(sw-1),p[1]*(sh-1)];});
      function D(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}
      var ow=(D(P[0],P[1])+D(P[3],P[2]))/2,oh=(D(P[0],P[3])+D(P[1],P[2]))/2;
      if(ow<16||oh<16){msg.textContent='框選的範圍太小了，請把四個角拉開一點。';return;}
      var sc=Math.min(1,1600/Math.max(ow,oh));ow=Math.round(ow*sc);oh=Math.round(oh*sc);
      // square-to-quad homography: (u,v) in the output maps to a point inside the dragged quad
      var x0=P[0][0],y0=P[0][1],x1=P[1][0],y1=P[1][1],x2=P[2][0],y2=P[2][1],x3=P[3][0],y3=P[3][1];
      var dx1=x1-x2,dx2=x3-x2,sx=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,sy=y0-y1+y2-y3,den=dx1*dy2-dx2*dy1,hg=0,hh=0;
      if(Math.abs(den)<1e-6){msg.textContent='四個角的位置不太對，請重新拖曳。';return;}
      if(Math.abs(sx)>1e-9||Math.abs(sy)>1e-9){hg=(sx*dy2-dx2*sy)/den;hh=(dx1*sy-sx*dy1)/den;}
      var a=x1-x0+hg*x1,b=x3-x0+hh*x3,c=x0,d=y1-y0+hg*y1,e=y3-y0+hh*y3,f=y0;
      var out=new ImageData(ow,oh),O=out.data,i=0;
      for(var y=0;y<oh;y++){var v=(y+0.5)/oh;for(var x=0;x<ow;x++,i+=4){var u=(x+0.5)/ow,w=hg*u+hh*v+1,fx=(a*u+b*v+c)/w,fy=(d*u+e*v+f)/w;
        if(fx<0)fx=0;else if(fx>sw-1.001)fx=sw-1.001;if(fy<0)fy=0;else if(fy>sh-1.001)fy=sh-1.001;
        var ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,o=(iy*sw+ix)*4,o2=o+sw*4,w00=(1-tx)*(1-ty),w10=tx*(1-ty),w01=(1-tx)*ty,w11=tx*ty;
        O[i]=S[o]*w00+S[o+4]*w10+S[o2]*w01+S[o2+4]*w11;O[i+1]=S[o+1]*w00+S[o+5]*w10+S[o2+1]*w01+S[o2+5]*w11;
        O[i+2]=S[o+2]*w00+S[o+6]*w10+S[o2+2]*w01+S[o2+6]*w11;O[i+3]=255;}}
      applyAdj(O,st.gain,st.hl);
      var oc=document.createElement('canvas');oc.width=ow;oc.height=oh;oc.getContext('2d').putImageData(out,0,0);
      close(oc.toDataURL('image/jpeg',0.9));
    }
    el.onclick=function(ev){var b=ev.target.closest('button');if(!b)return;var a=b.dataset.a;
      if(a==='wb'){st.pick=!st.pick;wbBtn.classList.toggle('on',st.pick);msg.textContent=st.pick?'點一下畫面中「本來應該是白色或中性灰」的地方，例如畫紙留白或白色畫框。':MSG;drawOv();}
      else if(a==='reset'){st.pts=[[0,0],[1,0],[1,1],[0,1]];st.gain=[1,1,1];st.hl=0;st.pick=false;$('#edHl').value=0;wbBtn.classList.remove('on');wbBtn.textContent='白平衡：點選白色或灰色處';msg.textContent=MSG;paint();drawOv();}
      else if(a==='ok')finish();else if(a==='cancel')close(null);};
    ed={cancel:function(){close(null);}};
    window.addEventListener('resize',layout);layout();
  });
}
function restore(){
  return storeAll().then(function(all){
    var jobs=Object.keys(all).map(function(k){var i=+k,v=all[k];if(!(i>=0&&i<N)||!v)return null;
      works[i]={title:v.title||'',artist:v.artist||'',year:v.year||'',medium:v.medium||'',desc:v.desc||'',img:v.img||null};
      drawPlacard(i);
      return v.img?loadImg(v.img).then(function(im){applyImage(i,im);}).catch(function(){works[i].img=null;}):null;});
    return Promise.all(jobs);
  }).catch(function(e){if(REMOTE)toast('共用儲存連線失敗，目前顯示示範作品');if(window.console)console.warn(e);});
}

/* ---------- sheet: info + upload ---------- */
function toast(t){hint.textContent=t;hint.style.display='block';hint.style.top='62px';hint.style.bottom='auto';hint.style.opacity=1;clearTimeout(hintT);hintT=setTimeout(function(){hint.style.opacity=0;hint.style.display='';hint.style.top='';hint.style.bottom='';},6000);}
var sheet=$('#sheet'),veil=$('#veil'),sheetOpen=false,pendingImg=null,lastFocus=null;
function openSheet(i,edit){
  if(edit&&!canEdit()){openLogin();return;}
  if(!sheetOpen)lastFocus=document.activeElement;
  sheetOpen=true;pendingImg=null;sheet.classList.add('on');veil.classList.add('on');keys={};
  if(i==='login')renderLogin();else edit?renderEdit(i):renderView(i);sheet.scrollTop=0;
  var f=sheet.querySelector(i==='login'?'#lEmail':edit?'#fTitle':'.x');if(f&&!isTouch)f.focus();
}
function closeSheet(){sheetOpen=false;sheet.classList.remove('on');veil.classList.remove('on');if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true});}catch(e){}}
veil.onclick=closeSheet;
function openLogin(){openSheet('login',false);}
function renderLogin(){
  sheet.innerHTML='<button class="x" aria-label="關閉">×</button><div class="no">管理員</div><h3>登入後上傳作品</h3>'+
    '<p class="desc" style="margin-bottom:6px">所有人都能參觀；只有展間的管理員可以更換作品。</p>'+
    '<form id="lf" novalidate><label for="lEmail">Email</label><input type="text" inputmode="email" autocomplete="username" id="lEmail" maxlength="120">'+
    '<label for="lPass">密碼</label><input type="password" autocomplete="current-password" id="lPass" maxlength="72" style="width:100%;font:15px var(--sans);padding:10px 12px;border:1px solid #c9c2b3;border-radius:6px;background:#fff;color:#1b1916">'+
    '<div class="err" id="lErr" role="alert"></div>'+
    '<div class="acts"><button class="b" type="submit">登入</button><button class="b o" type="button" data-a="signup">第一次使用：建立帳號</button></div></form>'+
    '<p class="note">第一個建立帳號並登入的人會成為這個展間唯一的管理員。建立帳號後會收到一封確認信，點信裡的連結再回來登入（連結開出來的頁面打不開是正常的）。</p>';
  var err=$('#lErr'),form=$('#lf');
  function val(){var e=$('#lEmail').value.trim(),p=$('#lPass').value;if(!/^\S+@\S+\.\S+$/.test(e)){err.textContent='請輸入 Email。';return null;}if(p.length<8){err.textContent='密碼至少 8 個字元。';return null;}return {email:e,password:p};}
  function busy(b){[].forEach.call(form.querySelectorAll('button'),function(x){x.disabled=b;});}
  function after(j){setSess(j);return checkAdmin().then(function(ok){
    if(ok){closeSheet();toast('已登入，可以上傳與更換作品');}
    else{signOut();busy(false);err.textContent='這個帳號不是管理員，沒有上傳權限。';}});}
  function msg(e){var c=e.code||'';return c==='invalid_credentials'?'Email 或密碼不對。':c==='email_not_confirmed'?'請先點確認信裡的連結，再回來登入。':c==='user_already_exists'?'這個 Email 已經建立過帳號，請直接登入。':/rate|429/i.test(c+e.message)?'嘗試太多次，請稍後再試。':'沒有成功：'+e.message;}
  form.onsubmit=function(ev){ev.preventDefault();err.textContent='';var v=val();if(!v)return;busy(true);
    authPost('token?grant_type=password',v).then(after).catch(function(e){busy(false);err.textContent=msg(e);});};
  sheet.onclick=function(ev){var b=ev.target.closest('button');if(!b)return;
    if(b.classList.contains('x')){closeSheet();return;}
    if(b.dataset.a==='signup'){err.textContent='';var v=val();if(!v)return;busy(true);
      authPost('signup',v).then(function(j){if(j.access_token)return after(j);busy(false);err.style.color='#3b6b3b';err.textContent='確認信已寄出。點信裡的連結後，回來按「登入」。';})
        .catch(function(e){busy(false);err.style.color='';err.textContent=msg(e);});}};
}
function artURL(i){var m=works[i];if(m.img)return m.img;try{return SLOTS[i].art.material.map.image.toDataURL('image/jpeg',.8);}catch(e){return '';}}
function renderView(i){
  var m=works[i];
  sheet.innerHTML='<button class="x" aria-label="關閉">×</button><img class="pv" alt="" src="'+artURL(i)+'">'+
    '<div class="no">作品 '+('0'+(i+1)).slice(-2)+'</div><h3>'+esc(m.title||'未命名')+'</h3>'+
    '<div class="by">'+esc([m.artist,m.year].filter(Boolean).join(' · '))+'</div><div class="med">'+esc(m.medium)+'</div>'+
    '<p class="desc">'+esc(m.desc)+'</p><div class="acts">'+(canEdit()?'<button class="b" data-a="edit">更換／編輯作品</button>':'')+'<button class="b o" data-a="close">關閉</button></div>';
  sheet.onclick=function(ev){var b=ev.target.closest('button');if(!b)return;
    if(b.dataset.a==='edit')openSheet(i,true);else closeSheet();};
}
function renderEdit(i){
  var m=works[i],isDef=!m.img&&m.desc===DEF_DESC,opts='';
  for(var k=0;k<N;k++)opts+='<option value="'+k+'"'+(k===i?' selected':'')+'>第 '+(k+1)+' 號畫框'+(k===N-1?'（端牆大幅）':'')+(works[k].img?' · 已掛你的作品':'')+'</option>';
  sheet.innerHTML='<button class="x" aria-label="關閉">×</button><div class="no">上傳作品</div><h3>掛上你的作品</h3>'+
    '<form id="f" novalidate><label for="fSlot">畫框位置</label><select id="fSlot">'+opts+'</select>'+
    '<label>作品圖片</label><div class="drop'+(m.img?' has':'')+'" id="drop" role="button" tabindex="0">'+(m.img?'已有圖片，點這裡可更換':'點這裡選擇圖片（JPG／PNG）')+'</div>'+
    '<input type="file" id="fFile" accept="image/*" hidden>'+
    '<label for="fTitle">標題</label><input type="text" id="fTitle" maxlength="60" value="'+esc(isDef?'':m.title)+'" placeholder="作品名稱">'+
    '<div class="two"><div><label for="fArtist">作者</label><input type="text" id="fArtist" maxlength="40" value="'+esc(isDef?'':m.artist)+'"></div>'+
    '<div><label for="fYear">年份</label><input type="text" id="fYear" maxlength="20" value="'+esc(m.year)+'"></div></div>'+
    '<label for="fMed">媒材／尺寸</label><input type="text" id="fMed" maxlength="60" value="'+esc(isDef?'':m.medium)+'" placeholder="例：壓克力、畫布，60 × 80 cm">'+
    '<label for="fDesc">作品介紹</label><textarea id="fDesc" maxlength="600" placeholder="這件作品想說什麼？">'+esc(isDef?'':m.desc)+'</textarea>'+
    '<div class="err" id="fErr" role="alert"></div>'+
    '<div class="acts"><button class="b" type="submit">儲存並掛上</button><button class="b o" type="button" data-a="close">取消</button>'+
    (isDef?'':'<button class="b t" type="button" data-a="reset">恢復示範作品</button>')+(REMOTE?'<button class="b t" type="button" data-a="logout">登出</button>':'')+'</div></form>'+
    '<p class="note">'+(REMOTE?'作品會存到共用空間，所有打開這個網站的人都看得到。':'作品只存在你這台裝置的瀏覽器裡，其他人打開這個頁面看不到，換裝置或清除瀏覽資料後也會消失。')+'</p>';
  var file=$('#fFile'),drop=$('#drop'),err=$('#fErr');
  drop.onclick=function(){file.click();};
  drop.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click();}};
  file.onchange=function(){var f=file.files&&file.files[0];if(!f)return;err.textContent='';drop.textContent='處理中…';
    fileToImage(f).then(openEditor).then(function(u){file.value='';
        if(!u){drop.textContent=pendingImg?'已選擇圖片，點這裡可重選':(m.img?'已有圖片，點這裡可更換':'點這裡選擇圖片（JPG／PNG）');return;}
        pendingImg=u;drop.classList.add('has');drop.textContent='已校正：'+f.name;})
      .catch(function(){pendingImg=null;drop.textContent='點這裡選擇圖片（JPG／PNG）';err.textContent='這個檔案讀不出來，請換一張 JPG 或 PNG。';});};
  $('#fSlot').onchange=function(){var keep=pendingImg;renderEdit(+this.value);if(keep){pendingImg=keep;var d=$('#drop');d.classList.add('has');d.textContent='已選擇圖片';}};
  sheet.onclick=function(ev){var b=ev.target.closest('button');if(!b)return;
    if(b.classList.contains('x')||b.dataset.a==='close')closeSheet();
    else if(b.dataset.a==='logout'){signOut();closeSheet();toast('已登出');}
    else if(b.dataset.a==='reset'){b.disabled=true;
      storeDel(i).then(function(){works[i]=defaultMeta(i);applyImage(i,genArt(i));drawPlacard(i);afterChange(i);closeSheet();})
        .catch(function(){b.disabled=false;err.textContent='移除失敗，請稍後再試。';});}};
  $('#f').onsubmit=function(ev){
    ev.preventDefault();
    var img=pendingImg||m.img;
    if(!img){err.textContent='請先選一張作品圖片。';return;}
    var v={title:$('#fTitle').value.trim()||'未命名',artist:$('#fArtist').value.trim(),year:$('#fYear').value.trim(),medium:$('#fMed').value.trim(),desc:$('#fDesc').value.trim(),img:img};
    var btn=this.querySelector('button[type=submit]');btn.disabled=true;btn.textContent=REMOTE?'上傳中…':'儲存中…';err.textContent='';

    loadImg(img).then(function(im){
      return storeSave(i,v).then(function(saved){done(saved,im);},function(e){
        if(REMOTE){btn.disabled=false;btn.textContent='儲存並掛上';err.textContent='上傳到共用空間失敗，請稍後再試。';if(window.console)console.warn(e);}
        else{done(v,im);toast('這個瀏覽器無法儲存，重新整理後作品會消失');}
      });
    },function(){btn.disabled=false;btn.textContent='儲存並掛上';err.textContent='圖片載入失敗，請再選一次。';});
  };
}
function afterChange(i){buildStops();capIdx=-9;if(mode==='tour')goStop(i+1);}
$('#upTop').onclick=function(){if(!canEdit()){openLogin();return;}var i=0;for(var k=0;k<N;k++){if(!works[k].img){i=k;break;}}openSheet(i,true);};

/* ---------- where you can walk: hall, archway, apse ---------- */
function walkable(x,z){
  var ax=Math.abs(x);
  if(z>=ZB+0.8){
    if(Math.abs(z-DOORZ)<=DOORHW-0.45)return x>=-W/2-0.25&&x<=W/2-0.75; // step into the doorway
    return ax<=W/2-0.75&&z<=ZF-0.8;
  }
  if(z>=ZB-0.8)return ax<=AR-0.6;
  return ax<=AW/2-0.75&&z>=ZB-AD+0.9;
}
/* ---------- loop ---------- */
var clock=new THREE.Clock(),prog=$('#bar-prog'),fq=new THREE.Quaternion(),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clock.getDelta(),0.05);
  if(mode==='tour'){
    var p=progress();tourPose(p);
    var k=reduce?1:1-Math.exp(-dt*5.5);
    camera.position.lerp(tPos,k);camera.quaternion.slerp(tQ,k);
    prog.style.width=(p*100).toFixed(2)+'%';
    var f=p*(stops.length-1),idx=Math.round(f),near=Math.abs(f-idx)<0.27;
    if(near&&idx!==capIdx)renderCap(idx);
    cap.classList.toggle('on',near&&!sheetOpen);
  }else{
    if(!sheetOpen){
      var turn=(keys.KeyQ?1:0)-(keys.KeyE?1:0);yaw+=turn*1.7*dt+wheel.turn*dt;
      var fw=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y;
      var st=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
      var l=Math.hypot(fw,st);if(l>1){fw/=l;st/=l;}
      fw+=wheel.fwd;var wd=Math.exp(-dt*7);wheel.fwd*=wd;wheel.turn*=wd;
      var sp=3.3*dt,sy=Math.sin(yaw),cy=Math.cos(yaw);
      var ox=camera.position.x,oz=camera.position.z,nx=ox+(-sy*fw+cy*st)*sp,nz=oz+(-cy*fw-sy*st)*sp;
      if(walkable(nx,nz)){ox=nx;oz=nz;}else if(walkable(nx,oz)){ox=nx;}else if(walkable(ox,nz)){oz=nz;}
      camera.position.x=ox;camera.position.z=oz;
      camera.position.y=EYE;
    }
    eul.set(pitch,yaw,0,'YXZ');fq.setFromEuler(eul);camera.quaternion.slerp(fq,reduce?1:1-Math.exp(-dt*18));
    updateHots();
  }
  renderer.render(scene,camera);
}

/* ---------- boot ---------- */
resize();
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
tourPose(0);camera.position.copy(tPos);camera.quaternion.copy(tQ);
renderCap(0);
updateAuthUI();
if(REMOTE&&session)checkAdmin();
restore().then(function(){buildStops();capIdx=-9;});
frame();
fade.style.opacity=0;
})();
